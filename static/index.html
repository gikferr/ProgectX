<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мероприятия</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ═══ Экран 1 — Главный (список мероприятий) ═══ -->
<div id="screen-main" class="screen">
  <div class="tabs">
    <button class="tab active" data-status="active">Актуальные</button>
    <button class="tab" data-status="past">Прошедшие</button>
  </div>
  <div id="events-list">Загрузка...</div>

  <button id="btn-enter-code" class="btn-secondary" style="margin-top:16px;">
    🔑 Ввести код организатора
  </button>
  <button id="btn-create-event" class="btn-primary" style="display:none; margin-top:8px;">
    + Создать мероприятие
  </button>
</div>

<!-- ═══ Экран 2 — Ввод кода организатора ═══ -->
<div id="screen-code" class="screen" style="display:none;">
  <button class="btn-back" onclick="showMain()">← Назад</button>
  <h2>Код организатора</h2>
  <input type="text" id="org-code-input" placeholder="ORG-XXXX" />
  <button id="btn-save-code" class="btn-primary">Активировать</button>
</div>

<!-- ═══ Экран 3 — Создание мероприятия ═══ -->
<div id="screen-create" class="screen" style="display:none;">
  <button class="btn-back" onclick="showMain()">← Назад</button>
  <h2>Создать мероприятие</h2>
  <input type="text" id="ev-title" placeholder="Название" />
  <input type="text" id="ev-desc" placeholder="Описание (необязательно)" />
  <label style="font-size:14px; color:#666;">Дата и время:</label>
  <input type="datetime-local" id="ev-date" />
  <button id="btn-save-event" class="btn-primary">Создать</button>
</div>

<!-- ═══ Экран 4 — Карточка мероприятия ═══ -->
<div id="screen-event" class="screen" style="display:none;">
  <button class="btn-back" onclick="showMain()">← Назад</button>
  <h2 id="event-title"></h2>
  <p id="event-meta" style="color:#666;"></p>
  <div id="event-status-badge"></div>

  <!-- Участники -->
  <div class="block">
    <h3>👥 Участники</h3>
    <div id="event-members"></div>
  </div>

  <!-- Опросы -->
  <div class="block">
    <h3>🗳 Опросы</h3>
    <div id="event-polls">Загрузка...</div>
    <button id="btn-create-poll" class="btn-secondary" style="display:none;">
      + Создать опрос
    </button>
  </div>

  <!-- Ссылка-приглашение (только организатор) -->
  <div id="invite-block" class="block" style="display:none;">
    <h3>🔗 Пригласить</h3>
    <div id="invite-link" style="word-break:break-all; font-size:13px;"></div>
    <button id="btn-copy-invite" class="btn-secondary">Копировать ссылку</button>
  </div>

  <!-- Действия -->
  <div class="block" id="event-actions">
    <button id="btn-leave" class="btn-danger" style="display:none;">
      Покинуть мероприятие
    </button>
    <button id="btn-finish" class="btn-secondary" style="display:none;">
      Завершить мероприятие
    </button>
    <button id="btn-delete-event" class="btn-danger" style="display:none;">
      Удалить навсегда
    </button>
  </div>
</div>

<!-- ═══ Экран 5 — Создание опроса ═══ -->
<div id="screen-create-poll" class="screen" style="display:none;">
  <button class="btn-back" onclick="closePollCreate()">← Назад</button>
  <h2>Новый опрос</h2>
  <input type="text" id="poll-theme" placeholder="Тема опроса" />
  <label style="font-size:14px; color:#666;">Варианты (минимум 2):</label>
  <div id="poll-options">
    <input type="text" class="poll-option" placeholder="Вариант 1" />
    <input type="text" class="poll-option" placeholder="Вариант 2" />
  </div>
  <button id="btn-add-option" class="btn-secondary">+ Добавить вариант</button>
  <label style="font-size:14px; color:#666;">Дедлайн (необязательно):</label>
  <input type="datetime-local" id="poll-deadline" />
  <button id="btn-save-poll" class="btn-primary">Создать</button>
</div>

<script src="app.js"></script>
</body>
</html>
